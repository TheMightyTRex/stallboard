name: Check a submission
# A stranger opens or edits an issue made from the Submit a plug-in form. This reads the plug-in file they point at AS
# DATA ONLY (never run, imported or unpacked), runs Starboard's own manifest check on it, comments with what passed and
# what to fix, and labels the issue checks-passed or checks-failed. It checks out the default branch only: nothing the
# submitter wrote is ever checked out, installed or run. No secrets are used; the token is the job's own.
on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: check-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Run the checks
    # The label is put on the issue by the issue form itself. A body is never used here, only the event file.
    if: contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # read the repository
      issues: write  # comment on and label the submission issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Count the checks made in the last hour
        id: rate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p reports
          since=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/$GH_REPO/issues/comments?since=$since&per_page=100" --paginate --slurp > reports/recent-comments.json
          python3 tools/submission.py rate
      - name: Pause when too many were checked
        if: steps.rate.outputs.limited == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$NUMBER" --body-file reports/submission/comment.md
      - name: Run the checks
        if: steps.rate.outputs.limited != 'true'
        run: python3 tools/submission.py check
      - name: Comment and label
        if: steps.rate.outputs.limited != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('reports/submission/result.json'))['passed'] else 1)"; then
            add=checks-passed; remove=checks-failed
          else
            add=checks-failed; remove=checks-passed
          fi
          gh issue comment "$NUMBER" --body-file reports/submission/comment.md --edit-last --create-if-none
          gh issue edit "$NUMBER" --add-label "$add" --remove-label "$remove" || gh issue edit "$NUMBER" --add-label "$add"
