name: Refresh snapshots
# Once a day, and when a release is published (see below), reads each listed plug-in's file again (as data), and the list of
# Starboard releases, and opens ONE pull request with what changed, for a person to read and merge. It never commits to main.
# A plug-in whose new file fails Starboard's check keeps its old snapshot. If a maker's server is down the old snapshot stays;
# the build leaves a listing out only when its snapshot is older than 14 days.
# Three jobs, so no job holds more than it needs:
#   read      reads from the internet with a token that can only read (contents: read); the token goes to api.github.com only
#   propose   has write access, runs no code that read from the internet, and opens the pull request
#   tell      only when a job failed: opens (or adds to) one issue, so a failing refresh is never unnoticed for days
# The repository setting "Allow GitHub Actions to create and approve pull requests" must be on for propose to open the pull request.
#
# To refresh as soon as a release is published, the release workflow of Starboard or of starboard-plugins sends one event here
# (it needs a fine-grained token with Contents: write on this repository, kept as a secret in that repository):
#   gh api repos/TheMightyTRex/stallboard/dispatches -f event_type=starboard-release
#   (or -f event_type=plugin-release)
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [starboard-release, plugin-release]

permissions: {}

concurrency:
  group: refresh-snapshots
  cancel-in-progress: false

jobs:
  read:
    name: Read the snapshots and the Starboard releases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # read only: this job holds the token that is sent to api.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never pushes
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Refresh the plug-in snapshots
        run: |
          set -o pipefail
          mkdir -p reports
          python3 tools/refresh_snapshots.py 2>&1 | tee reports/refresh-snapshots.log
      - name: Refresh the Starboard releases
        # GitHub limits calls to its API that carry no token, and the runners share addresses, so without one this failed
        # with a 403 on 24 and 25 November 2026. The token is sent to api.github.com only (tools/lib/safefetch.py).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 tools/refresh_releases.py 2>&1 | tee reports/refresh-releases.log
      - name: Check the site still builds
        run: python3 tools/build.py --out reports/site-test
      - name: Say what failed in the run summary
        if: failure()
        run: |
          {
            echo "### The refresh failed"
            echo
            echo "The old snapshots stay. The last lines of what it printed:"
            echo
            echo '```'
            tail -n 25 reports/*.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh
          path: |
            data
            assets/starboard
          retention-days: 3
          if-no-files-found: error

  propose:
    name: Open a pull request if anything changed
    needs: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # push the branch
      pull-requests: write  # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # to push the refresh branch; this job runs only code from main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh
          path: .
      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data assets/starboard)" ]; then echo "Nothing changed."; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          # An open refresh pull request is updated in place. Otherwise the branch name carries the run id, so a second run on one day cannot collide.
          existing=$(gh pr list --state open --base main --json number,headRefName --jq '[.[] | select(.headRefName | startswith("refresh/"))][0] | if . then "\(.number) \(.headRefName)" else empty end')
          mkdir -p reports
          { echo "A daily refresh. A person reads it before merging: anything that asks for more than before is in bold."; echo; cat data/refresh-report.md 2>/dev/null || true; } > reports/refresh-body.md
          if [ -n "$existing" ]; then
            number="${existing%% *}"; branch="${existing#* }"
          else
            number=""; branch="refresh/$day-${GITHUB_RUN_ID}"
          fi
          git checkout -b "$branch"
          git add data assets/starboard
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh snapshots and Starboard releases ($day)"
          if [ -n "$number" ]; then
            # Each refresh starts from main and holds the whole change, so the new commit replaces the old one on the open branch.
            git push --force origin "$branch"
            gh pr edit "$number" --title "Refresh snapshots ($day)" --body-file reports/refresh-body.md
          else
            git push origin "$branch"
            gh pr create --base main --head "$branch" --title "Refresh snapshots ($day)" --body-file reports/refresh-body.md
          fi

  tell:
    name: Open an issue when a refresh fails
    needs: [read, propose]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write  # open or add to the issue
    steps:
      - name: Open the issue, or add to the one that is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="The daily refresh is failing"
          body="The refresh of the plug-in snapshots and Starboard releases failed, so the store may be out of date. The old snapshots stay, and a listing is left out of the site after 14 days without a new one. Run: $RUN"
          open=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then gh issue comment "$open" --body "Failed again. $body"; else gh issue create --title "$title" --body "$body"; fi
